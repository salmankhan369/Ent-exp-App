apiVersion: apps/v1
kind: Deployment
metadata:
  name: ent-exp-app-deployment
  labels:
    app: ent-exp-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ent-exp-app
  template:
    metadata:
      labels:
        app: ent-exp-app
    spec:
      containers:
      - name: ent-exp-container
        image: 396633054990.dkr.ecr.us-east-1.amazonaws.com/ent-exp-app-repo:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"