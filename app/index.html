<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ent-exp-App | Enterprise Expense Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6">
  <div class="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
    <div class="flex items-center justify-between border-b border-slate-800 pb-4 mb-6">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-sky-500/20 text-sky-400 flex items-center justify-center font-bold text-lg">
          <i class="fa-solid fa-wallet"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-white">Ent-exp-App</h1>
          <p class="text-xs text-slate-400">Enterprise Expense Tracker Service</p>
        </div>
      </div>
      <span class="px-3 py-1 text-xs rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center gap-1.5 font-medium">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> Live v1.0
      </span>
    </div>

    <div class="space-y-4">
      <div class="p-4 rounded-xl bg-slate-800/60 border border-slate-700/50 flex justify-between items-center">
        <div>
          <div class="text-sm font-semibold text-white">AWS Cloud Hosting</div>
          <div class="text-xs text-slate-400">Infrastructure</div>
        </div>
        <div class="text-emerald-400 font-bold">$140.00</div>
      </div>
      <div class="p-4 rounded-xl bg-slate-800/60 border border-slate-700/50 flex justify-between items-center">
        <div>
          <div class="text-sm font-semibold text-white">CI/CD Pipeline Runners</div>
          <div class="text-xs text-slate-400">DevOps Automation</div>
        </div>
        <div class="text-emerald-400 font-bold">$60.00</div>
      </div>
    </div>

    <div class="mt-6 pt-4 border-t border-slate-800 flex items-center justify-between text-xs text-slate-500">
      <span>Status: <span class="text-emerald-400 font-semibold">Healthy (200 OK)</span></span>
      <span>Cluster: AWS EKS</span>
    </div>
  </div>
</body>
</html>
